<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scope Guard</title>
<style>
  :root {
    --bg: #f7f6f3; --ink: #21201c; --muted: #6f6a5f; --line: #e4e0d6;
    --accent: #b0512e; --accent-dark: #8a3f22; --bubble-bot: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  body { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  #counter { font-size: 12px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 4px 10px; white-space: nowrap; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; text-align: center; max-width: 90%; }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
  footer { flex-shrink: 0; padding: 10px 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; font-size: 14.5px; font-family: inherit; max-height: 90px; background: #fff; outline: none; }
  #send { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 16px; cursor: pointer; }
  #send:disabled { opacity: 0.5; }
  #paywall { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; padding: 20px; }
  #paywall.open { display: flex; }
  .paycard { background: #fff; border-radius: 16px; padding: 24px; max-width: 340px; width: 100%; text-align: center; }
  .paycard h2 { font-size: 18px; margin: 0 0 8px; }
  .paycard p { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin: 0 0 18px; }
  .paycard button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .paycard button:hover { background: var(--accent-dark); }
  .paycard .price { font-size: 26px; font-weight: 700; margin: 0 0 4px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Scope Guard</h1>
    <p>Paste a client ask. Get a reply that protects your scope.</p>
  </div>
  <span id="counter">5 free left</span>
</header>

<div id="chat"></div>

<footer>
  <textarea id="input" rows="1" placeholder="Paste the client's message..."></textarea>
  <button id="send" aria-label="Send">↑</button>
</footer>

<div id="paywall">
  <div class="paycard">
    <h2>You've used your 5 free replies</h2>
    <p class="price">$9<span style="font-size:14px; font-weight:400; color:var(--muted);">/month</span></p>
    <p>Unlimited scope-creep replies, price suggestions, and change-order wording — cancel anytime.</p>
    <button id="upgradeBtn">Upgrade now</button>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const counterEl = document.getElementById('counter');
const paywall = document.getElementById('paywall');
const upgradeBtn = document.getElementById('upgradeBtn');

let history = [];

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}
function updateCounter(remainingFree, paid) {
  if (paid) { counterEl.textContent = 'Unlimited'; return; }
  if (remainingFree === null) return;
  counterEl.textContent = remainingFree + (remainingFree === 1 ? ' free left' : ' free left');
}

async function refreshStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    updateCounter(data.remainingFree, data.paid);
  } catch (e) {}
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addMsg('user', text);
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history }),
    });

    if (res.status === 402) {
      hideTyping();
      paywall.classList.add('open');
      sendBtn.disabled = false;
      return;
    }

    const data = await res.json();
    hideTyping();

    if (!res.ok) {
      addMsg('system', data.error || 'Something went wrong.');
      sendBtn.disabled = false;
      return;
    }

    addMsg('bot', data.reply);
    history.push({ role: 'user', content: text });
    history.push({ role: 'assistant', content: data.reply });
    updateCounter(data.remainingFree, data.paid);

    if (!data.paid && data.remainingFree === 0) {
      setTimeout(() => paywall.classList.add('open'), 600);
    }
  } catch (err) {
    hideTyping();
    addMsg('system', 'Network error — try again.');
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

upgradeBtn.addEventListener('click', async () => {
  upgradeBtn.disabled = true;
  upgradeBtn.textContent = 'Redirecting...';
  try {
    const res = await fetch('/api/create-checkout-session', { method: 'POST' });
    const data = await res.json();
    if (data.url) window.location.href = data.url;
  } catch (e) {
    upgradeBtn.disabled = false;
    upgradeBtn.textContent = 'Upgrade now';
  }
});

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 90) + 'px';
});

addMsg('bot', "Paste what the client asked for, and I'll draft a reply that keeps it a paid add-on instead of free extra work.");
refreshStatus();

if (new URLSearchParams(window.location.search).get('upgraded') === '1') {
  addMsg('system', "Payment received — you're unlimited now.");
  refreshStatus();
}
</script>
</body>
</html>
